name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Node 24 ships with npm 11 by default — needed for
      # trusted-publisher tokenless OIDC publishing. We deliberately
      # do NOT pass `registry-url` to setup-node above, because that
      # writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and an
      # empty token there overrides the OIDC tokenless flow.
      - run: npm --version

      - run: npm ci

      - name: Publish to npm
        # --tag next: expo-module's prepublishOnly refuses prerelease
        # versions without an explicit dist-tag. Matches
        # publishConfig.tag in package.json.
        run: npm publish --tag next --provenance --access public
