name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted-publisher tokenless OIDC needs npm 11.5+ (Node 22 ships
      # with npm 10). Skip setup-node's `registry-url` because that
      # writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc — and an
      # empty token there overrides the OIDC flow.
      - name: Upgrade npm for OIDC trusted-publisher support
        run: |
          npm install -g npm@11
          npm --version

      - run: npm ci

      - name: Publish to npm
        # --tag next: expo-module's prepublishOnly refuses prerelease
        # versions without an explicit dist-tag. Matches
        # publishConfig.tag in package.json.
        run: npm publish --tag next --provenance --access public
